<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-label="Aegean Blueprint">
  <!-- Solid teal background fills the entire viewBox so the favicon reads as
       a teal-on-tab square regardless of browser theme. -->
  <rect width="32" height="32" rx="6" fill="#0B8FAC"/>
  <!-- Tapered legs (V2-style sharper points) at favicon scale.
       At 32px viewbox, the legs go from (16, 7) at top to ~(7, 26) bottom-left
       and (25, 26) bottom-right, narrowing to a point. -->
  <path d="M 15.2 7 L 16.8 7 L 7.3 26.2 L 6.7 25.8 Z" fill="#ffffff"/>
  <path d="M 15.2 7 L 16.8 7 L 25.3 25.8 L 24.7 26.2 Z" fill="#ffffff"/>
  <!-- Crossbar — orange, prominent. -->
  <line x1="10" y1="19" x2="22" y2="19" stroke="#FF8C3A" stroke-width="2.4" stroke-linecap="round"/>
</svg>
